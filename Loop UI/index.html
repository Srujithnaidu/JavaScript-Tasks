<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Loop Programs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>JavaScript Loop Programs</h1>

        <div class="program">
            <label>Number of times to display "Hello World"</label>
            <label>Enter number:</label>
            <input type="number" id="num1">
            <button onclick="displayHello()">Display</button>
            <p id="result1" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 1 to n</label>
            <label>Enter a number n:</label>
            <input type="number" id="num2">
            <button onclick="displayNumbers()">Display</button>
            <p id="result2" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 5 to n</label>
            <label>Enter a number n:</label>
            <input type="number" id="num3">
            <button onclick="display5ton()">Display</button>
            <p id="result3" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 11 to n</label>
            <label>Enter a number n:</label>
            <input type="number" id="num4">
            <button onclick="display11ton()">Display</button>
            <p id="result4" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 11 to n in reverse</label>
            <label>Enter a number n:</label>
            <input type="number" id="num5">
            <button onclick="displayndownto11()">Display</button>
            <p id="result5" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 6 to n with increment of 3</label>
            <label>Enter number n:</label>
            <input type="number" id="num6">
            <button onclick="display6ton()">Display</button>
            <p id="result6" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 9 to n with increment of 5</label>
            <label>Enter the number n:</label>
            <input type="number" id="num7">
            <button onclick="display9ton()">Display</button>
            <p id="result7" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers n to 1 using for loop</label>
            <label>Enter a number:</label>
            <input type="number" id="num8">
            <button onclick="displaynto1()">Display</button>
            <p id="result8" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers n to 16 where n is greater than or equal to 16</label>
            <label>Enter a number:</label>
            <input type="number" id="num9">
            <button onclick="displayndownto16()">Display</button>
            <p id="result9" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers n to 1 with decrement of 4</label>
            <label>Enter a number n:</label>
            <input type="number" id="num10">
            <button onclick="display14downto2()">Display</button>
            <p id="result10" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 1 to n using while loop</label>
            <label>Enter a number:</label>
            <input type="number" id="num11">
            <button onclick="display1tonwhile()">Display</button>
            <p id="result11" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers 10 to n with increment of 10</label>
            <label>Enter the ending number n:</label>
            <input type="number" id="num12">
            <button onclick="multiplesof10()">Display</button>
            <p id="result12" class="result"></p>
        </div>

        <div class="program">
            <label>To display numbers n to 1 using while loop</label>
            <label>Enter a number:</label>
            <input type="number" id="num13">
            <button onclick="ndownto1()">Display</button>
            <p id="result13" class="result"></p>
        </div>

        <div class="program">
            <label>To display sum of numbers from 2 to n using while loop</label>
            <label>Enter the ending number:</label>
            <input type="number" id="num14">
            <button onclick="calculateSum2ton()">Calculate Sum</button>
            <p id="result14" class="result"></p>
        </div>

        <div class="program">
            <label>To display sum of numbers from 2 to n using for loop</label>
            <label>Enter the ending number:</label>
            <input type="number" id="num15">
            <button onclick="calculateSum2tonfor()">Calculate Sum</button>
            <p id="result15" class="result"></p>
        </div>

        <div class="program">
            <label>To display sum of numbers from 1 to n using for loop</label>
            <label>Enter the ending number:</label>
            <input type="number" id="num16">
            <button onclick="calculateSum1ton()">Calculate Sum</button>
            <p id="result16" class="result"></p>
        </div>

        <div class="program">
            <label>To display factorial of a given number</label>
            <label>Enter a number:</label>
            <input type="number" id="num17">
            <button onclick="calculateFactorial()">Calculate Factorial</button>
            <p id="result17" class="result"></p>
        </div>

        <div class="program">
            <label>Enter the ending number:</label>
            <input type="number" id="num18">
            <button onclick="generateOutput()">Generate</button>
            <p id="result18" class="result"></p>
        </div>

    </div>

    <script>
        function displayHello() {
            let n = parseInt(document.getElementById("num1").value);
            let output = "";
            for (let i = 1; i <= n; i++) {
                output = output + "Hello World<br>";
            }
            document.getElementById("result1").innerHTML = output;
        }

        function displayNumbers() {
            let n = parseInt(document.getElementById("num2").value);
            let output = "";
            for (let i = 1; i <= n; i++) {
                output = output + i + "<br>";
            }
            document.getElementById("result2").innerHTML = output;
        }

        function display5ton() {
            let n = parseInt(document.getElementById("num3").value);
            let output = "";
            for (let i = 5; i <= n; i++) {
                output = output + i + "<br>";
            }
            document.getElementById("result3").innerHTML = output;
        }

        function display11ton() {
            let n = parseInt(document.getElementById("num4").value);
            let output = "";
            for (let i = 11; i <= n; i++) {
                output = output + i + "<br>";
            }
            document.getElementById("result4").innerHTML = output;
        }

        function displayndownto11() {
            let n = parseInt(document.getElementById("num5").value);
            let output = "";
            for (let i = n; i >= 11; i--) {
                output = output + i + "<br>";
            }
            document.getElementById("result5").innerHTML = output;
        }

        function display6ton() {
            let n = parseInt(document.getElementById("num6").value);
            let output = "";
            for (let i = 6; i <= n; i = i + 3) {
                output = output + i + "<br>";
            }
            document.getElementById("result6").innerHTML = output;
        }

        function display9ton() {
            let n = parseInt(document.getElementById("num7").value);
            let output = "";
            for (let i = 9; i <= n; i = i + 5) {
                output = output + i + "<br>";
            }
            document.getElementById("result7").innerHTML = output;
        }

        function displaynto1() {
            let n = parseInt(document.getElementById("num8").value);
            let output = "";
            for (let i = n; i >= 1; i--) {
                output = output + i + "<br>";
            }
            document.getElementById("result8").innerHTML = output;
        }

        function displayndownto16() {
            let n = parseInt(document.getElementById("num9").value);
            let output = "";
            for (let i = n; i >= 16; i--) {
                output = output + i + "<br>";
            }
            document.getElementById("result9").innerHTML = output;
        }

        function display14downto2() {
            let n = parseInt(document.getElementById("num10").value);
            let output = "";
            for (let i = n; i >= 2; i = i - 4) {
                output = output + i + "<br>";
            }
            document.getElementById("result10").innerHTML = output;
        }

        function display1tonwhile() {
            let n = parseInt(document.getElementById("num11").value);
            let i = 1;
            let output = "";

            while (i <= n) {
                output = output + i + "<br>";
                i = i + 1;
            }

            document.getElementById("result11").innerHTML = output;
        }

        function multiplesof10() {
            let n = parseInt(document.getElementById("num12").value);
            let i = 10;
            let output = "";

            while (i <= n) {
                output = output + i + "<br>";
                i = i + 10;
            }

            document.getElementById("result12").innerHTML = output;
        }

        function ndownto1() {
            let n = parseInt(document.getElementById("num13").value);
            let i = n;
            let output = "";

            while (i >= 1) {
                output = output + i + "<br>";
                i = i - 1;
            }

            document.getElementById("result13").innerHTML = output;
        }

        function calculateSum2ton() {
            let n = parseInt(document.getElementById("num14").value);
            let sum = 0;
            let i = 2;

            while (i <= n) {
                sum = sum + i;
                i = i + 1;
            }

            document.getElementById("result14").innerHTML = "Sum = " + sum;
        }

        function calculateSum2tonfor() {
            let n = parseInt(document.getElementById("num15").value);
            let sum = 0;

            for (let i = 2; i <= n; i = i + 1) {
                sum = sum + i;
            }

            document.getElementById("result15").innerHTML = "Sum = " + sum;
        }

        function calculateSum1ton() {
            let n = parseInt(document.getElementById("num16").value);
            let sum = 0;

            for (let i = 1; i <= n; i = i + 1) {
                sum = sum + i;
            }

            document.getElementById("result16").innerHTML = "Sum = " + sum;
        }

        function calculateFactorial() {
            let n = parseInt(document.getElementById("num17").value);
            let fact = 1;

            for (let i = n; i >= 1; i = i - 1) {
                fact = fact * i;
            }

            document.getElementById("result17").innerHTML = "Factorial = " + fact;
        }

        function generateOutput() {
            let n = parseInt(document.getElementById("num18").value);
            let output = "";

            for (let i = 1; i <= n; i++) {
                output = output + i;
            }

            document.getElementById("result18").innerHTML = output;
        }
    </script>

</body>
</html>
