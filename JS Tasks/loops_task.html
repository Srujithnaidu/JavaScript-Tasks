<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Number of times to display "Hello World"</label><br>
    <label>Enter number: </label>
    <input type="number" id="num1"><br>
    <button onclick="displayHello()">Display</button><br><br>

    <label>To display numbers 1 to n</label><br>
    <label>Enter a number n: </label>
    <input type="number" id="num2"><br>
    <button onclick="displayNumbers()">Display</button><br><br>

    <label>To display numbers 5 to n</label><br>
    <label>Enter a number n: </label>
    <input type="number" id="num3"><br>
    <button onclick="display5ton()">Display</button><br><br>

    <label>To display numbers 11 to n</label><br>
    <label>Enter a number n: </label>
    <input type="number" id="num4"><br>
    <button onclick="display11ton()">Display</button><br><br>

    <label>To display numbers 11 to n in reverse</label><br>
    <label>Enter a number n: </label>
    <input type="number" id="num5"><br>
    <button onclick="displayndownto11()">Display</button><br><br>

    <label>To display numbers 6 to n with increment of 3</label><br>
    <label>Enter number n: </label>
    <input type="number" id="num6"><br>
    <button onclick="display6ton()">Display</button><br><br>

    <label>To display numbers 9 to n with increment of 5</label><br>
    <label>Enter the number n: </label>
    <input type="number" id="num7"><br>
    <button onclick="display9ton()">Display</button><br><br>

    <label>To display numbers n to 1 using for loop</label><br>
    <label>Enter a number: </label>
    <input type="number" id="num8"><br>
    <button onclick="displaynto1()">Display</button><br><br>

    <label>To display numbers n to 16 where n is greater than or equal to 16</label><br>
    <label>Enter a number: </label>
    <input type="number" id="num9"><br>
    <button onclick="displayndownto16()">Display</button><br><br>

    <label>To display numbers n to 1 with decrement of 4</label><br>
    <label>Enter a number n: </label>
    <input type="number" id="num10"><br>
    <button onclick="display14downto2()">Display</button><br><br>

    <label>To display numbers 1 to n using while loop</label><br>
    <label>Enter a number: </label>
    <input type="number" id="num11"><br>
    <button onclick="display1tonwhile()">Display</button><br><br>

    <label>To display numbers 10 to n with increment of 10</label><br>
    <label>Enter the ending number n: </label>
    <input type="number" id="num12"><br>
    <button onclick="multiplesof10()">Display</button><br><br>

    <label>To display numbers n to 1 using while loop</label><br>
    <label>Enter a number: </label>
    <input type="number" id="num13"><br>
    <button onclick="ndownto1()">Display</button><br><br>

    <label>To display sum of numbers from 2 to n using while loop</label><br>
    <label>Enter the ending number: </label>
    <input type="number" id="num14"><br>
    <button onclick="calculateSum2ton()">Calculate Sum</button><br><br>

    <label>To display sum of numbers from 2 to n using for loop</label><br>
    <label>Enter the ending number: </label>
    <input type="number" id="num15"><br>
    <button onclick="calculateSum2tonfor()">Calculate Sum</button><br><br>

    <label>To display sum of numbers from 1 to n using for loop</label><br>
    <label>Enter the ending number: </label>
    <input type="number" id="num16"><br>
    <button onclick="calculateSum1ton()">Calculate Sum</button><br><br>

    <label>To display factorial of a given number</label><br>
    <label>Enter a number: </label>
    <input type="number" id="num17"><br>
    <button onclick="calculateFactorial()">Calculate Factorial</button><br><br>

    <label>Enter the ending number: </label>
    <input type="number" id="num18"><br>
    <button onclick="generateOutput()">Generate</button><br><br>


    <script>
        function displayHello() {
            let n = parseInt(document.getElementById("num1").value);
            for (let i = 1; i <= n; i++) {
                document.write("Hello World<br>");
            }
        }

        function displayNumbers() {
            let n = parseInt(document.getElementById("num2").value);
            for (let i = 1; i <= n; i++) {
                document.write(i + "<br>");
            }
        }

        function display5ton() {
            let n = parseInt(document.getElementById("num3").value);
            for (let i = 5; i <= n; i++) {
                document.write(i + "<br>");
            }
        }

        function display11ton() {
            let n = parseInt(document.getElementById("num4").value);
            for (let i = 11; i <= n; i++) {
                document.write(i + "<br>");
            }
        }

        function displayndownto11() {
            let n = parseInt(document.getElementById("num5").value);
            for (let i = n; i >= 11; i--) {
                document.write(i + "<br>");
            }
        }

        function display6ton() {
            let n = parseInt(document.getElementById("num6").value);
            for (let i = 6; i <= n; i = i + 3) {
                document.write(i + "<br>");
            }
        }

        function display9ton() {
            let n = parseInt(document.getElementById("num7").value);
            for (let i = 9; i <= n; i = i + 5) {
                document.write(i + "<br>");
            }
        }

        function displaynto1() {
            let n = parseInt(document.getElementById("num8").value);
            for (let i = n; i >= 1; i--) {
                document.write(i + "<br>");
            }
        }

        function displayndownto16() {
            let n = parseInt(document.getElementById("num9").value);
            for (let i = n; i >= 16; i--) {
                document.write(i + "<br>");
            }
        }

        function display14downto2() {
            let n = parseInt(document.getElementById("num10").value);
            for (let i = n; i >= 2; i = i - 4) {
                document.write(i + "<br>");
            }
        }

        function display1tonwhile() {
            let n = parseInt(document.getElementById("num11").value);
            let i = 1;
            while (i <= n) {
                document.write(i + "<br>");
                i = i + 1;
            }
        }

        function multiplesof10() {
            let n = parseInt(document.getElementById("num12").value);
            let i = 10;
            while (i <= n) {
                document.write(i + "<br>");
                i = i + 10;
            }
        }

        function ndownto1() {
            let n = parseInt(document.getElementById("num13").value);
            let i = n;
            while (i >= 1) {
                document.write(i + "<br>");
                i = i - 1;
            }
        }

        function calculateSum2ton() {
            let n = parseInt(document.getElementById("num14").value);
            let sum = 0;
            let i = 2;
            while (i <= n) {
                sum = sum + i;
                i = i + 1;
            }
            document.write("Sum = " + sum);
        }

        function calculateSum2tonfor() {
            let n = parseInt(document.getElementById("num15").value);
            let sum = 0;
            for (let i = 2; i <= n; i = i + 1) {
                sum = sum + i;
            }
            document.write("Sum = " + sum);
        }

        function calculateSum1ton() {
            let n = parseInt(document.getElementById("num16").value);
            let sum = 0;
            for (let i = 1; i <= n; i = i + 1) {
                sum = sum + i;
            }
            document.write("Sum = " + sum);
        }

        function calculateFactorial() {
            let n = parseInt(document.getElementById("num17").value);
            let fact = 1;
            for (let i = n; i >= 1; i = i - 1) {
                fact = fact * i;
            }
            document.write("Factorial = " + fact);
        }

        function generateOutput() {
            let n = parseInt(document.getElementById("num18").value);
            let output = "";
            for (let i = 1; i <= n; i++) {
                output = output + i;
            }
            document.write(output);
        }
        
    </script>
</body>
</html>
