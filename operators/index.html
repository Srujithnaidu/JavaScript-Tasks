<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Arithmetic operator
        document.write("<b>Arithmetic Operators</b>","</br>")
        var a=25;
        var b=5;
        document.write("Addition: ",a ," + ",b," is: ",a+b,"</br>");
        document.write("Subtraction: ",a ," - ",b," is: ",a-b,"</br>");
        document.write("Multiplication: ",a ," * ",b," is: ",a*b,"</br>");
        document.write("Division: ",a ," / ",b," is: ",a/b,"</br>");
        document.write("Modulus: ",a ," % ",b," is: ",a%b,"</br>");
        document.write("Exponentiation of ", a ," to the power ", b," numbers: ",a**b,"</br>");
        //Relational operators
        document.write("<b>Relational Operators</b>","</br>")
        var a=25;
        var b="25";
        document.write("Strict Equality : ",a ," === ",b," --> ",a===b,"</br>");
        document.write("Equality : ",a ," == ",b," --> ",a==b,"</br>");
        document.write("Not Equality : ",a ," != ",b," --> ",a!=b,"</br>");
        document.write("Greater than : ",a ," > ",b," --> ",a>b,"</br>");
        document.write("Less than : ",a ," < ",b," --> ",a<b,"</br>");
        document.write("Greater than or equal to : ", a ," >= ", b," --> ",a>=b,"</br>");
        document.write("Less than or equal to : ", a ," <= ", b," --> ",a>=b,"</br>");
        //Logical operators
        document.write("<b>Logical Operators</b>","</br>")
        var ch="k";
        document.write("AND-- &&" , "--> ",ch>="a" && ch<="z","</br>");
        document.write("OR-- ||  --> ",ch>="z" || ch<="h","</br>");
        document.write("NOT-- !  --> ",!ch,"</br>");
        //Assignment operators
        document.write("<b>Assignment Operators</b>","</br>")
        var a=25;
        var b=10;
        document.write("Addition: ",a ," += ",b," is: ",a+=b,"</br>");
        document.write("Subtraction: ",a ," -= ",b," is: ",a-=b,"</br>");
        document.write("Multiplication: ",a ," *= ",b," is: ",a*=b,"</br>");
        document.write("Division: ",a ," /= ",b," is: ",a/=b,"</br>");
        document.write("Modulus: ",a ," %= ",b," is: ",a%=b,"</br>");
        document.write("Exponentiation of ", a ," to the power ", b," is: ",a**=b,"</br>");
        //Bitwise operators
        document.write("<b>Bitwise Operators</b>","</br>")
        //AND &
        var a=8;
        var b=5;
        var x=1;
        var y=2;
        var z=-5
        document.write("AND-- & of " ,a," and ",b," is ", a&b,"</br>");
        document.write("OR-- | of ",a," and ",b," is ", a|b,"</br>");
        document.write("NOT-- ~ of ",b," is ",~b,"</br>");
        document.write("XOR-- ^ of ",a," and ",b," is ", a^b,"</br>");
        document.write("Left shift-- << of ",x," and ",y," is ", x<<y,"</br>");
        document.write("Right shift-- >> of ",z," and ",x," is ", z>>x,"</br>");
        document.write("Unsigned Right shift-- >>> of ",z," and ",x," is ", z>>>x,"</br>");
        document.write("Unsigned Right shift-- >>> of ",b," and ",x," is ", b>>>x,"</br>");

        //Unary operator
        document.write("<b>Unary Operators</b>","</br>")
        document.write("Arithmetic operator</br>");
        var o=12
        document.write("Before increment: ",o,"</br>");
        o=o+1
        document.write("After increment: ",o,"</br>");
        document.write("Assignment operator</br>");
        var p=12
        document.write("Before increment: ",p,"</br>");
        p+=1
        document.write("After increment: ",p,"</br>");
        document.write("Unary operator</br>");
        var q=12
        document.write("Before increment: ",q,"</br>");
        q++
        document.write("After increment: ",q,"</br>");

        document.write("Post increment","</br>");
        var g=10
        document.write(g++,"</br>"); //postfix increment operator (g++) returns the variable's current value first, and then increases it to 11 afterward.
        document.write(g,"</br>");
        document.write("Pre increment","</br>");
        var h=2
        document.write(++h,"</br>"); //3
        document.write(h,"</br>"); //3
    </script>
</body>
</html>
